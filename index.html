<!DOCTYPE html>
<html>
<head>
  <title>Air Quality Dashboard</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script src="app.js"></script>
  <style>
    body { font-family: Arial; background: #f4f6f8; text-align: center; }
    .card { background: white; padding: 20px; border-radius: 10px; margin: 10px; display: inline-block; width: 150px; box-shadow: 0 0 5px #aaa; }
  </style>
</head>
<body>
  <h1>🌍 IoT Air Quality Dashboard</h1>
  <div class="card"><h3>Temperature</h3><p id="temp">--</p></div>
  <div class="card"><h3>Humidity</h3><p id="hum">--</p></div>
  <div class="card"><h3>PM2.5</h3><p id="pm">--</p></div>
  <div class="card"><h3>CO₂</h3><p id="co2">--</p></div>
</body>
</html>
